<!DOCTYPE html>
<html lang="ur-Latn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bijli Bill Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef2ef; --card:#ffffff; --ink:#13262b; --muted:#5d7176; --line:#d5dfdb;
  --teal:#0f766e; --amber:#f2a900; --amber-ink:#3d2b00; --a:#0f766e; --b:#c2410c; --warn:#b42318;
  --field:#f6f9f7;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1a1d; --card:#16272b; --ink:#e8f1ee; --muted:#93aaa9; --line:#27403f;
    --teal:#2dd4bf; --a:#2dd4bf; --b:#fb923c; --warn:#ff8a7a; --field:#101e21;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1a1d; --card:#16272b; --ink:#e8f1ee; --muted:#93aaa9; --line:#27403f;
  --teal:#2dd4bf; --a:#2dd4bf; --b:#fb923c; --warn:#ff8a7a; --field:#101e21;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding:28px 18px 48px}
header{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.dial{width:54px;height:54px;flex:none}
h1{font-size:clamp(1.5rem,4vw,2.2rem);font-weight:800;margin:0;letter-spacing:-.02em;line-height:1.1}
header p{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:18px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.card h2{font-size:1.05rem;font-weight:600;margin:0 0 14px}
.group{margin-bottom:20px}
.group:last-child{margin-bottom:0}
.group-title{font-size:.85rem;color:var(--muted);margin:0 0 8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:.88rem;font-weight:600;margin-bottom:5px}
input{width:100%;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--field);
  border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;outline:none;transition:border-color .15s}
input:focus-visible{border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 25%,transparent)}
input.name{font-weight:600}
.btns{display:flex;gap:10px;margin-top:6px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 18px;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.reset{background:transparent;color:var(--muted);border:1.5px solid var(--line)}
.sample{background:var(--amber);color:var(--amber-ink);flex:1}
.empty{border:2px dashed var(--line);border-radius:14px;padding:34px 18px;text-align:center;color:var(--muted)}
.msg{background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--warn);border-radius:12px;padding:11px 14px;font-size:.92rem;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
@media(max-width:480px){.stats{grid-template-columns:1fr}}
.stat{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat small{display:block;color:var(--muted);font-size:.8rem}
.stat b{font-size:1.2rem;font-weight:800}
.people{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.people{grid-template-columns:1fr}}
.person{border-radius:16px;padding:18px;border:2px solid var(--c)}
.person .who{font-weight:600;color:var(--c);margin:0 0 4px}
.person .amt{font-size:clamp(1.6rem,5vw,2.1rem);font-weight:800;letter-spacing:-.02em;line-height:1.1}
.person dl{margin:12px 0 0;font-size:.88rem}
.person dl div{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--line)}
.person dt{color:var(--muted)}
.person dd{margin:0;font-weight:600}
.bar{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:18px 0 6px;background:var(--line)}
.bar span{display:block;transition:width .35s ease}
.barlbl{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)}
.total{margin-top:16px;background:var(--ink);color:var(--bg);border-radius:14px;padding:14px 18px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.total b{font-size:1.4rem;font-weight:800}
.total span{opacity:.8;font-size:.9rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="dial" viewBox="0 0 56 56" aria-hidden="true">
      <circle cx="28" cy="28" r="25" fill="none" stroke="var(--ink)" stroke-width="3"/>
      <path d="M10 36a18 18 0 0 1 36 0" fill="none" stroke="var(--line)" stroke-width="5" stroke-linecap="round"/>
      <path d="M10 36a18 18 0 0 1 22-17.5" fill="none" stroke="var(--amber)" stroke-width="5" stroke-linecap="round"/>
      <line x1="28" y1="36" x2="38" y2="22" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="28" cy="36" r="3.5" fill="var(--ink)"/>
    </svg>
    <div>
      <h1>Bill Calculator</h1>
      <p>Bill calculation from main meters to sub meters</p>
    </div>
  </header>

  <div class="grid">
    <section class="card" aria-labelledby="in-h">
      <h2 id="in-h">Meter's Information</h2>

      <div class="group">
        <p class="group-title">Main meter</p>
        <div class="row">
          <div><label for="mbill">Total bill (Rs)</label><input id="mbill" type="number" inputmode="decimal" min="0" step="any" placeholder="Like 25000"></div>
          <div><label for="munits">Total units</label><input id="munits" type="number" inputmode="decimal" min="0" step="any" placeholder="Like 800"></div>
        </div>
      </div>

      <div class="group">
        <p class="group-title">Sub meters</p>
        <div class="row">
          <div><label for="n1">First Name</label><input id="n1" class="name" type="text" value="Hashir"></div>
          <div><label for="u1">Units</label><input id="u1" type="number" inputmode="decimal" min="0" step="any" placeholder="Like 350"></div>
        </div>
        <div class="row" style="margin-top:10px">
          <div><label for="n2">Second Name</label><input id="n2" class="name" type="text" value="Muzamil"></div>
          <div><label for="u2">Units</label><input id="u2" type="number" inputmode="decimal" min="0" step="any" placeholder="Like 400"></div>
        </div>
      </div>

      <div class="btns">
        <button class="sample" id="sample" type="button">Fill Example</button>
        <button class="reset" id="reset" type="button">Clear</button>
      </div>
    </section>

    <section class="card" aria-labelledby="out-h" aria-live="polite">
      <h2 id="out-h">Calculations</h2>
      <div id="out"></div>
    </section>
  </div>
</div>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var out = $('out');
  var ids = ['mbill','munits','u1','u2','n1','n2'];
  var nf = new Intl.NumberFormat('en-PK',{minimumFractionDigits:2,maximumFractionDigits:2});
  var uf = new Intl.NumberFormat('en-PK',{maximumFractionDigits:2});
  function esc(s){return s.replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function val(id){var v=$(id).value; return v===''?NaN:parseFloat(v)}

  function render(){
    var bill=val('mbill'), mu=val('munits'), u1=val('u1'), u2=val('u2');
    var n1=esc($('n1').value.trim()||'Pehla'), n2=esc($('n2').value.trim()||'Doosra');
    if([bill,mu,u1,u2].some(isNaN)){
      out.innerHTML='<div class="empty">After enter the values press submit button to show calculation.</div>';
      return;
    }
    if(bill<0||mu<=0||u1<0||u2<0){
      out.innerHTML='<div class="msg">Main meter ke units 0 se zyada hon aur koi value minus mein na ho.</div>';
      return;
    }
    var tu=u1+u2;
    if(tu<=0){
      out.innerHTML='<div class="msg">Dono sub meters ke units mila kar 0 se zyada hone chahiye.</div>';
      return;
    }
    var per=bill/mu;
    var tbill=tu*per;
    var loss=mu-tu;
    var warn='';
    if(loss<0) warn='<div class="msg">Sub meters ke units main meter se zyada hain, is liye losses minus aa rahe hain. Readings dobara check karein.</div>';
    var l1=(u1/tu)*loss, l2=(u2/tu)*loss;
    var f1=u1+l1, f2=u2+l2;
    var b1=f1*per, b2=f2*per;
    var p1=b1/(b1+b2)*100;
    function person(cls,n,u,l,f,b){
      return '<div class="person" style="--c:var(--'+cls+')"><p class="who">'+n+'</p><div class="amt">Rs '+nf.format(b)+'</div>'
        +'<dl><div><dt>Units</dt><dd>'+uf.format(u)+'</dd></div>'
        +'<div><dt>Loss units</dt><dd>'+uf.format(l)+'</dd></div>'
        +'<div><dt>Total units</dt><dd>'+uf.format(f)+'</dd></div></dl></div>';
    }
    out.innerHTML = warn
      +'<div class="stats">'
      +'<div class="stat"><small>Per unit rate</small><b>Rs '+nf.format(per)+'</b></div>'
      +'<div class="stat"><small>Bill without loss units</small><b>Rs '+nf.format(tbill)+'</b></div>'
      +'<div class="stat"><small>Loss units</small><b>'+uf.format(loss)+'</b></div>'
      +'</div>'
      +'<div class="people">'+person('a',n1,u1,l1,f1,b1)+person('b',n2,u2,l2,f2,b2)+'</div>'
      +'<div class="bar" role="img" aria-label="Bill ki taqseem"><span style="width:'+p1+'%;background:var(--a)"></span><span style="width:'+(100-p1)+'%;background:var(--b)"></span></div>'
      +'<div class="barlbl"><span>'+n1+' '+p1.toFixed(1)+'%</span><span>'+n2+' '+(100-p1).toFixed(1)+'%</span></div>'
      +'<div class="total"><span>Bill with loss units</span><b>Rs '+nf.format(b1+b2)+'</b></div>';
  }

  ids.forEach(function(i){$(i).addEventListener('input',render)});
  $('sample').addEventListener('click',function(){
    $('mbill').value=25000;$('munits').value=800;$('u1').value=350;$('u2').value=400;render();
  });
  $('reset').addEventListener('click',function(){
    ['mbill','munits','u1','u2'].forEach(function(i){$(i).value=''});
    $('n1').value='Hashir';$('n2').value='Muzamil';render();
  });
  render();
})();
</script>
</body>
</html>
